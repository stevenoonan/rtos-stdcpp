# SPDX-License-Identifier: MIT
name: C++17 qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cxx17-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  host:
    name: Host ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install supported host compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 clang-18 libclang-rt-18-dev cmake ninja-build
      - name: Execute C++17 host tests with UBSan
        run: >-
          python3 tools/run_matrix.py --environment host --host-compiler '${{ matrix.compiler }}'
          --config '${{ matrix.config }}'
          --output "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-${{ matrix.compiler }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 7
  a9:
    name: A9 ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/prepared/packages
            ${{ runner.temp }}/prepared/qemu/packages
          key: a9-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/profiles/st-gcc-14.3.1-download.json', 'cmake/profiles/qemu-8.2.2-ubuntu24-x86_64.json') }}
      - name: Install emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm cmake ninja-build
      - name: Prepare exact compiler and emulator
        run: python3 tools/setup_ci.py --kind a9 --destination "$RUNNER_TEMP/prepared"
      - name: Execute C++17 A9 tests and real tick-wrap variants
        run: >-
          python3 tools/run_matrix.py --environment a9 --config '${{ matrix.config }}'
          --toolchain-root "$RUNNER_TEMP/prepared/toolchain" --qemu-root "$RUNNER_TEMP/prepared/qemu"
          --output "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: a9-${{ matrix.config }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 7
  required:
    name: Required C++17 checks
    needs: [host, a9]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every profile to succeed
        env:
          HOST_RESULT: ${{ needs.host.result }}
          A9_RESULT: ${{ needs.a9.result }}
        run: test "$HOST_RESULT" = success && test "$A9_RESULT" = success
